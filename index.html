<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ocean</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #panel {
    position: fixed; top: 10px; left: 10px; max-height: calc(100vh - 40px);
    width: 300px; overflow-y: auto; padding: 10px 14px;
    background: rgba(10, 20, 30, 0.66); color: #eee; border-radius: 8px;
    font: 12px/1.7 system-ui, sans-serif; user-select: none;
    backdrop-filter: blur(6px);
  }
  #panel > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: baseline; }
  #panel > summary::-webkit-details-marker { display: none; }
  #fps { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.75; font-weight: 400; }
  #panel .group { margin-top: 10px; }
  #panel .group > summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px;
    margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; opacity: 0.5; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 2px;
  }
  #panel .group > summary::-webkit-details-marker { display: none; }
  #panel .group > summary::before { content: '\25B8'; font-size: 9px; opacity: 0.8; }
  #panel .group[open] > summary::before { content: '\25BE'; }
  #panel .group > summary:hover { opacity: 0.85; }
  #panel label { display: grid; grid-template-columns: 96px 1fr 34px; gap: 8px; align-items: center; }
  #panel label > span { text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; }
  #panel input[type=range] { width: 100%; min-width: 0; }
  #panel select { width: 100%; background: rgba(255,255,255,0.1); color: #eee; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 1px 3px; }
  #hint { margin: 10px 0 0; opacity: 0.55; line-height: 1.5; }
  #noiseDebug {
    position: fixed; top: 10px; right: 10px; bottom: 10px; overflow: auto;
    display: none; flex-direction: column; gap: 10px;
    background: rgba(10, 20, 30, 0.8); color: #eee; padding: 10px;
    border-radius: 8px; font: 11px/1.6 system-ui, sans-serif;
  }
  #noiseDebug canvas { width: 480px; display: block; }
  #error {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    background: #1a2633; color: #fff; font: 16px system-ui, sans-serif; padding: 2em;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<details id="panel" open>
  <summary>params <span id="fps">—</span></summary>
  <div id="controls"></div>
  <p id="hint">drag orbit (up past level to dive under) · right/shift-drag pan · wheel zoom · WASD move</p>
</details>
<div id="noiseDebug"></div>
<div id="error"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
