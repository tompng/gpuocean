<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ocean</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #panel {
    position: fixed; top: 10px; left: 10px; padding: 10px 14px;
    background: rgba(10, 20, 30, 0.6); color: #eee; border-radius: 8px;
    font: 12px/1.8 system-ui, sans-serif; user-select: none;
  }
  #panel label { display: grid; grid-template-columns: 80px 140px 36px; gap: 8px; align-items: center; }
  #panel span { text-align: right; }
  #error {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    background: #1a2633; color: #fff; font: 16px system-ui, sans-serif; padding: 2em;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="panel">
  <label>wavelength <input id="wavelength" type="range" min="5" max="60" step="1" value="24"><span></span></label>
  <label>amplitude <input id="amplitude" type="range" min="0" max="2" step="0.02" value="0.6"><span></span></label>
  <label>choppiness <input id="choppiness" type="range" min="0" max="3" step="0.05" value="1"><span></span></label>
  <label>layers <input id="layers" type="range" min="1" max="8" step="1" value="5"><span></span></label>
  <label>spread <input id="spread" type="range" min="0" max="90" step="1" value="40"><span></span></label>
  <label>dispersion <input id="dispersion" type="range" min="0" max="2" step="0.05" value="1"><span></span></label>
  <label>ripple <input id="ripple" type="range" min="0" max="0.6" step="0.01" value="0.2"><span></span></label>
  <label>rippleScale <input id="rippleScale" type="range" min="0.05" max="2.5" step="0.01" value="0.6"><span></span></label>
  <label>rippleAniso <input id="rippleAniso" type="range" min="0" max="1" step="0.05" value="0.5"><span></span></label>
  <label>rippleBias <input id="rippleBias" type="range" min="0" max="1" step="0.05" value="0"><span></span></label>
  <label>wireframe <input id="wireframe" type="checkbox"></label>
</div>
<div id="error"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
